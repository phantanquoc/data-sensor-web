services:
  mongo:
    image: mongo:7
    container_name: iot_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  iot-gateway:
    build: ./backend
    container_name: iot_gateway
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Trong mạng Docker gọi MongoDB qua tên service "mongo", không dùng localhost
      - MONGO_URI=mongodb://mongo:27017/mydb
      # Ép cố định để không lệch với cổng EXPOSE/publish ở trên
      - PORT_SERVER=3000
    depends_on:
      - mongo
    restart: unless-stopped

  iot-frontend:
    build:
      context: ./frontend
    container_name: iot_frontend
    ports:
      - "5174:5174"
    environment:
      # Vite proxy gọi backend qua tên service trong mạng Docker
      - BACKEND_URL=http://iot-gateway:3000
    volumes:
      # Mount source để sửa code là HMR cập nhật ngay, không cần rebuild
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
    depends_on:
      - iot-gateway
    restart: unless-stopped

volumes:
  mongo_data:
